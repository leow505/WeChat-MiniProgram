# PostgreSQL for local development and tests. Not for production; production
# provisions a managed instance and passes DATABASE_URL through the environment.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yueqiu
      POSTGRES_PASSWORD: yueqiu
      POSTGRES_DB: yueqiu
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yueqiu -d yueqiu']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
